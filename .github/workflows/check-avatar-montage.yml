name: Check Avatar Montage (no production)

on:
  workflow_dispatch:
  push:
    paths:
      - "remotion/**"
      - ".github/workflows/check-avatar-montage.yml"
  pull_request:
    paths:
      - "remotion/**"
      - ".github/workflows/check-avatar-montage.yml"

permissions:
  contents: read

concurrency:
  group: check-avatar-montage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: remotion

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Check project
        run: bash scripts/qa/check-project.sh

      - name: Safe preview render
        run: bash scripts/qa/preview.sh

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avatar-montage-check-${{ github.sha }}
          path: |
            remotion/out/qa/
          if-no-files-found: warn
          retention-days: 7
