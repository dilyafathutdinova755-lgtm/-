name: Check Avatar Montage (no production)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-avatar-montage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: remotion

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record checked version (gate-v1)
        env:
          CHECKED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CHECKED_SHA"
          mkdir -p out/qa
          printf '%s\n' "$CHECKED_SHA" > out/qa/checked-sha.txt
          printf '%s\n' 'avatar-preflight-v1' > out/qa/check-contract.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Install FFmpeg
        timeout-minutes: 5
        run: |
          set -euo pipefail

          if command -v ffmpeg >/dev/null 2>&1 &&
             command -v ffprobe >/dev/null 2>&1 &&
             ffmpeg -version >/dev/null 2>&1 &&
             ffprobe -version >/dev/null 2>&1; then
            echo "FFmpeg and ffprobe are already available."
          else
            APT_OPTIONS=(
              -o Acquire::Retries=2
              -o Acquire::http::Timeout=20
              -o Acquire::https::Timeout=20
              -o DPkg::Lock::Timeout=30
            )

            sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
              apt-get "${APT_OPTIONS[@]}" update

            sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
              apt-get "${APT_OPTIONS[@]}" install -y --no-install-recommends ffmpeg
          fi

          ffmpeg -version
          ffprobe -version
          echo "FFmpeg and ffprobe are ready."

      - name: Install dependencies
        run: npm ci

      - name: Check project
        run: bash scripts/qa/check-project.sh

      - name: Safe preview render
        run: bash scripts/qa/preview.sh

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avatar-montage-check-${{ github.sha }}
          path: remotion/out/qa/
          if-no-files-found: warn
          retention-days: 7
