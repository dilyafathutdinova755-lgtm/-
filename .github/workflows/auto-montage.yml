name: Auto Montage

on:
  repository_dispatch:
    types: [montage_video]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to montage"
        required: true
        type: string

permissions:
  contents: write
  actions: read
  id-token: write

jobs:
  montage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve and verify montage version
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const args = {
              owner: context.repo.owner,
              repo: context.repo.repo
            };

            const repository =
              `${args.owner}/${args.repo}`.toLowerCase();

            const qaPath =
              '.github/workflows/check-avatar-montage.yml';

            const autoMontagePath =
              '.github/workflows/auto-montage.yml';

            const validSha = (v) =>
              typeof v === 'string' &&
              /^[a-f0-9]{40}$/.test(v);

            const validId = (v) =>
              Number.isSafeInteger(v) && v > 0;

            const need = (ok, message) => {
              if (!ok) {
                throw new Error(
                  `PREFLIGHT BLOCKED: ${message}`
                );
              }
            };

            const requiredSteps = [
              'Checkout',
              'Record checked version (gate-v1)',
              'Setup Node',
              'Install FFmpeg',
              'Install dependencies',
              'Check project',
              'Safe preview render'
            ];

            const workflow =
              (await github.rest.actions.getWorkflow({
                ...args,
                workflow_id: 'check-avatar-montage.yml'
              })).data;

            need(
              workflow.path === qaPath &&
              workflow.state === 'active',
              'Wrong or inactive QA workflow'
            );

            let tag;
            let checkedSha;
            let qaRun;

            if (context.eventName === 'repository_dispatch') {
              const p =
                context.payload.client_payload || {};

              need(
                context.payload.action === 'montage_video',
                'Wrong repository_dispatch action'
              );

              tag = p.tag;

              need(
                typeof tag === 'string' &&
                /^video-[0-9]{8}-[0-9]{6}$/.test(tag),
                'Invalid release tag'
              );

              need(
                p.preflight_contract ===
                  'avatar-preflight-v1',
                'Invalid preflight contract'
              );

              need(
                validSha(p.checked_sha),
                'Invalid checked_sha'
              );

              need(
                validId(p.qa_run_id) &&
                validId(p.qa_run_attempt) &&
                validId(p.qa_workflow_id),
                'Invalid QA identifiers'
              );

              need(
                workflow.id === p.qa_workflow_id,
                'Wrong QA workflow ID'
              );

              checkedSha = p.checked_sha;

              qaRun =
                (await github.rest.actions.getWorkflowRun({
                  ...args,
                  run_id: p.qa_run_id
                })).data;

              need(
                qaRun.id === p.qa_run_id &&
                qaRun.run_attempt ===
                  p.qa_run_attempt,
                'QA run or attempt does not match'
              );

              if (context.sha !== checkedSha) {
                const [checked, dispatched] =
                  await Promise.all([
                    github.rest.repos.getContent({
                      ...args,
                      path: autoMontagePath,
                      ref: checkedSha
                    }),
                    github.rest.repos.getContent({
                      ...args,
                      path: autoMontagePath,
                      ref: context.sha
                    })
                  ]);

                need(
                  checked.data.type === 'file' &&
                  dispatched.data.type === 'file' &&
                  checked.data.sha ===
                    dispatched.data.sha,
                  'Auto Montage changed after preflight'
                );
              }
            } else if (
              context.eventName === 'workflow_dispatch'
            ) {
              need(
                process.env.GITHUB_REF ===
                  'refs/heads/main',
                'Manual recovery must run from main'
              );

              tag = context.payload.inputs?.tag;

              need(
                typeof tag === 'string' &&
                /^video-[0-9]{8}-[0-9]{6}$/.test(tag),
                'Invalid release tag'
              );

              checkedSha = context.sha;

              need(
                validSha(checkedSha),
                'Invalid current main SHA'
              );

              const runs =
                await github.rest.actions.listWorkflowRuns({
                  ...args,
                  workflow_id:
                    'check-avatar-montage.yml',
                  branch: 'main',
                  event: 'push',
                  status: 'completed',
                  head_sha: checkedSha,
                  per_page: 20
                });

              qaRun =
                runs.data.workflow_runs.find(
                  (run) =>
                    run.head_sha === checkedSha &&
                    run.head_branch === 'main' &&
                    run.event === 'push' &&
                    run.status === 'completed' &&
                    run.conclusion === 'success'
                );

              need(
                qaRun,
                `No successful QA for current main ${checkedSha}`
              );
            } else {
              throw new Error(
                `PREFLIGHT BLOCKED: unsupported event ${context.eventName}`
              );
            }

            need(
              qaRun.workflow_id === workflow.id,
              'QA belongs to wrong workflow'
            );

            need(
              qaRun.head_sha === checkedSha,
              'QA SHA does not match montage SHA'
            );

            need(
              qaRun.head_branch === 'main',
              'QA is not from main'
            );

            need(
              qaRun.event === 'push',
              'QA is not from a push run'
            );

            need(
              qaRun.status === 'completed' &&
              qaRun.conclusion === 'success',
              'QA run is not successful'
            );

            need(
              qaRun.repository?.full_name
                ?.toLowerCase() === repository &&
              qaRun.head_repository?.full_name
                ?.toLowerCase() === repository,
              'QA belongs to another repository'
            );

            need(
              typeof qaRun.path === 'string' &&
              qaRun.path.split('@')[0] === qaPath,
              'Wrong QA workflow path'
            );

            const jobs = await github.paginate(
              'GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs',
              {
                ...args,
                run_id: qaRun.id,
                attempt_number:
                  qaRun.run_attempt,
                per_page: 100
              }
            );

            const matches =
              jobs.filter(
                (job) => job.name === 'check'
              );

            need(
              matches.length === 1,
              'Expected exactly one QA check job'
            );

            const job = matches[0];

            need(
              job.run_id === qaRun.id &&
              job.head_sha === checkedSha &&
              job.status === 'completed' &&
              job.conclusion === 'success',
              'QA check job is not successful'
            );

            for (const name of requiredSteps) {
              const steps =
                (job.steps || []).filter(
                  (step) => step.name === name
                );

              need(
                steps.length === 1 &&
                steps[0].status === 'completed' &&
                steps[0].conclusion === 'success',
                `Required QA step failed or missing: ${name}`
              );
            }

            core.setOutput(
              'checked_sha',
              checkedSha
            );

            core.setOutput(
              'tag',
              tag
            );

            core.setOutput(
              'approved',
              'true'
            );

            core.setOutput(
              'version_rules',
              [
                `Уже выполнен checkout проверенного коммита ${checkedSha}.`,
                'Зависимости Remotion установлены из package-lock.json.',
                'Не переключай ветку/коммит и не выполняй git pull/reset/checkout.',
                'Не изменяй программу рендера, зависимости, конфигурацию, QA, workflow и CLAUDE.md.',
                'Обновляй только данные текущего ролика в remotion/src/data и его медиа в remotion/public.',
                'Не используй текст, аудио или готовый MP4 прошлого задания.',
                'Если требуется изменение программы, остановись с ошибкой, не обходи проверки.',
                'Не делай git push и не загружай результат в Release: это выполнит следующий шаг.'
              ].join('\n')
            );

            core.info(
              `Approved tag ${tag}, commit ${checkedSha}, QA run ${qaRun.id}`
            );

      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.checked_sha }}
          persist-credentials: false

      - name: Confirm checkout
        env:
          CHECKED_SHA: ${{ steps.version.outputs.checked_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CHECKED_SHA"

      - name: Setup Node for approved montage
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Prepare approved project
        working-directory: remotion
        run: |
          set -euo pipefail

          if ! command -v ffmpeg >/dev/null 2>&1 ||
             ! command -v ffprobe >/dev/null 2>&1; then
            sudo env DEBIAN_FRONTEND=noninteractive \
              apt-get update

            sudo env DEBIAN_FRONTEND=noninteractive \
              apt-get install -y --no-install-recommends ffmpeg
          fi

          npm ci
          bash scripts/qa/check-project.sh

      - name: Remove stale output
        run: |
          rm -f remotion/public/output.mp4
          rm -f final.mp4

      - name: Run Claude Code montage
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Смонтируй видео под тегом ${{ steps.version.outputs.tag }}.

            Исходный MP4 находится в GitHub Release с этим тегом.

            Работай по существующим инструкциям проекта и CLAUDE.md.

            Выполни монтаж так же, как при моей обычной ручной команде:
            "Смонтируй видео под тегом <тег>".

            ${{ steps.version.outputs.version_rules }}

            Готовый смонтированный ролик обязательно сохрани по точному пути:
            remotion/public/output.mp4
          claude_args: |
            --allowedTools Read,Write,Edit,Bash
            --max-turns 30

      - name: Verify approved renderer is unchanged
        env:
          CHECKED_SHA: ${{ steps.version.outputs.checked_sha }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$CHECKED_SHA"

          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          import sys

          sha = os.environ["CHECKED_SHA"]
          root = pathlib.Path.cwd()

          def protected(name):
              if name.startswith("remotion/src/"):
                  return not (
                      name.startswith(
                          "remotion/src/data/"
                      )
                      and name.endswith(".json")
                  )

              return (
                  name.startswith(
                      ".github/workflows/"
                  )
                  or name.startswith(
                      "remotion/scripts/qa/"
                  )
                  or name in {
                      "CLAUDE.md",
                      "remotion/CLAUDE.md",
                      "remotion/package.json",
                      "remotion/package-lock.json",
                      "remotion/tsconfig.json",
                      "remotion/remotion.config.ts",
                      "remotion/eslint.config.mjs",
                      "remotion/eslint.config.js",
                  }
              )

          paths = subprocess.check_output(
              [
                  "git",
                  "ls-tree",
                  "-r",
                  "--name-only",
                  "-z",
                  sha,
              ]
          ).split(b"\0")

          expected = {
              p.decode()
              for p in paths
              if p and protected(p.decode())
          }

          bad = []

          for name in sorted(expected):
              file = root / name

              original = subprocess.check_output(
                  ["git", "show", f"{sha}:{name}"]
              )

              if (
                  not file.is_file()
                  or file.is_symlink()
                  or file.read_bytes() != original
              ):
                  bad.append(name)

          for directory in (
              "remotion/src",
              "remotion/scripts/qa",
              ".github/workflows",
          ):
              for file in (
                  root / directory
              ).rglob("*"):

                  name = (
                      file.relative_to(root)
                      .as_posix()
                  )

                  if (
                      (
                          file.is_file()
                          or file.is_symlink()
                      )
                      and protected(name)
                      and name not in expected
                  ):
                      bad.append(name)

          if bad:
              print(
                  "::error::Approved renderer/configuration changed: "
                  + ", ".join(
                      sorted(set(bad))
                  )
              )
              sys.exit(1)

          print(
              "Approved renderer/configuration is unchanged."
          )
          PY

      - name: Render approved montage output
        working-directory: remotion
        timeout-minutes: 10
        run: |
          set -euo pipefail

          test -s public/source.mp4
          test -s public/audio.wav

          rm -f public/output.mp4

          ./node_modules/.bin/remotion render \
            src/index.ts \
            EgeOlimpiada \
            public/output.mp4

          test -s public/output.mp4

      - name: Validate approved montage output
        working-directory: remotion
        run: |
          set -euo pipefail

          node scripts/qa/validate-project.mjs
          bash scripts/qa/validate-mp4.sh public/output.mp4

      - name: Upload final video to Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          test -s remotion/public/output.mp4

          cp remotion/public/output.mp4 final.mp4

          gh release upload "$TAG" final.mp4 --clobber
