name: Auto Montage

on:
  repository_dispatch:
    types: [montage_video]

permissions:
  contents: write
  id-token: write

jobs:
  montage:
    runs-on: ubuntu-latest

    steps:
      - name: Run Claude Code montage
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Смонтируй видео под тегом ${{ github.event.client_payload.tag }}.

            Исходный MP4 находится в GitHub Release с этим тегом.
            Работай по существующим инструкциям проекта и CLAUDE.md.
            Выполни монтаж так же, как при моей обычной ручной команде
            "Смонтируй видео под тегом <тег>".

            Обязательно сохрани готовый смонтированный MP4 как файл
            внутри текущей рабочей директории GitHub Actions.
            Не удаляй готовый MP4 после завершения монтажа.

          claude_args: |
            --allowedTools Read,Write,Edit,Bash
            --max-turns 30

      - name: Find rendered MP4
        if: always()
        run: |
          echo "=== MP4 FILES CREATED DURING MONTAGE ==="
          find "$GITHUB_WORKSPACE" -type f -iname "*.mp4" -print
          echo "=== END MP4 LIST ==="name: Auto Montage

