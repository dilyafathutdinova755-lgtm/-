name: Claude CLI Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Install pinned Claude Code
        run: |
          set -euo pipefail

          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.287

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          "$HOME/.local/bin/claude" --version

      - name: Test Claude CLI directly
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISABLE_AUTOUPDATER: "1"
        run: |
          set -uo pipefail

          if [[ -z "${ANTHROPIC_API_KEY:-}" ]]; then
            echo "ERROR: ANTHROPIC_API_KEY secret is unavailable."
            exit 1
          fi

          STDOUT_FILE="$RUNNER_TEMP/claude-smoke.stdout"
          STDERR_FILE="$RUNNER_TEMP/claude-smoke.stderr"

          set +e

          "$HOME/.local/bin/claude" \
            --bare \
            -p "Ответь только словом OK" \
            --model opus \
            --output-format json \
            >"$STDOUT_FILE" \
            2>"$STDERR_FILE"

          CLAUDE_EXIT=$?

          set -e

          echo "===== CLAUDE EXIT CODE ====="
          echo "$CLAUDE_EXIT"

          echo "===== CLAUDE STDERR ====="
          if [[ -s "$STDERR_FILE" ]]; then
            cat "$STDERR_FILE"
          else
            echo "(empty)"
          fi

          echo "===== CLAUDE STDOUT ====="
          if [[ -s "$STDOUT_FILE" ]]; then
            cat "$STDOUT_FILE"
          else
            echo "(empty)"
          fi

          if [[ "$CLAUDE_EXIT" -ne 0 ]]; then
            echo "ERROR: Claude CLI exited with code $CLAUDE_EXIT"
            exit "$CLAUDE_EXIT"
          fi

          node - "$STDOUT_FILE" <<'NODE'
          const fs = require('node:fs');

          const path = process.argv[2];
          const raw = fs.readFileSync(path, 'utf8').trim();

          if (!raw) {
            throw new Error('Claude CLI returned empty stdout.');
          }

          const data = JSON.parse(raw);

          if (
            typeof data.result !== 'string' ||
            data.result.trim().length === 0
          ) {
            throw new Error('Claude CLI returned no text result.');
          }

          console.log('Claude CLI smoke passed.');
          NODE
